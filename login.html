  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const currentPage = window.location.pathname.split("/").pop();
      const isLoginPage = currentPage === "login.html";

      if (!isLoginPage) {
        loadToastLayout(() => {
          //  const token = localStorage.getItem("authToken");
          const token = sessionStorage.getItem("authToken");

          if (!token) {
            showErrorToast("You are not logged in. Please log in to continue.");

            setTimeout(() => {
              window.location.href = "login.html";
            }, 500);
          }
        });
      }
    });

  </script>
  <!-- <script type="text/javascript" src="assets/js/aos.js"></script> -->
  <script>
    async function handleLogin(event) {
      event.preventDefault(); // Prevent the form from submitting the traditional way

      const username = document.getElementById('P9999_USERNAME').value;
      const password = document.getElementById('P9999_PASSWORD').value;

      try {
        const response = await fetch(`${BASE_API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        // Check if there's an error in the response
        if (data.error) {
          showErrorToast(data.error); // Show the error message from the response
        } else if (data.token) {
          // If there's a token, proceed with navigation
          localStorage.setItem('authToken', data.token);
          sessionStorage.setItem('authToken', data.token);
          localStorage.setItem('loggedInUsername', username);
          window.location.href = 'admin-off-ir.html';
        } else {
          alert('Unexpected response from server.');
        }
      } catch (error) {
        console.error('Error logging in:', error);
        alert('An error occurred during login. Please try again.');
      }
    }
  </script>
